name: Sync to web1 & web2

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      # ---------- WEB2 ----------
      - name: Sync to web2
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}  # Pastikan nama secretnya sesuai
        run: |
          # Clone dengan token
          git clone https://x-access-token:${MY_TOKEN}@github.com/srytmj/ha-webserver-web2 temp-web2
          
          cd temp-web2
          # Bersihkan semua file kecuali .git
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +
          cd ..
          
          # Sync file dari web2/
          rsync -av --delete web2/ temp-web2/
          
          cd temp-web2
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          git add .
          git commit -m "sync from main repo - $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "no changes"
          
          # Push dengan token
          git push https://x-access-token:${MY_TOKEN}@github.com/srytmj/ha-webserver-web2 main
          
          cd ..
          rm -rf temp-web2

      # ---------- WEB1 ----------
      - name: Sync to web1
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone https://x-access-token:${MY_TOKEN}@github.com/srytmj/ha-webserver-web1 temp-web1
          
          cd temp-web1
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +
          cd ..
          
          rsync -av --delete web1/ temp-web1/
          
          cd temp-web1
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          git add .
          git commit -m "sync from main repo - $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "no changes"
          
          git push https://x-access-token:${MY_TOKEN}@github.com/srytmj/ha-webserver-web1 main
          
          cd ..
          rm -rf temp-web1