name: Sync to web1 & web2

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v3

      # ---------- WEB1 ----------
      - name: Sync to web1
        run: |
          rm -rf web1-repo
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/srytmj/ha-webserver-web1 web1-repo
          
          rsync -av --delete web1/ web1-repo/

          cd web1-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "sync from main repo - $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "no changes"
          git push origin main

      # ---------- WEB2 ----------
      - name: Sync to web2
        run: |
          rm -rf web2-repo
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/srytmj/ha-webserver-web2 web2-repo
          
          rsync -av --delete web2/ web2-repo/

          cd web2-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "sync from main repo - $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "no changes"
          git push origin main