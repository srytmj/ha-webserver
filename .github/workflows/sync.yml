name: Sync to web1 & web2

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      # ---------- WEB2 ----------
      - name: Sync to web2
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          rm -rf temp-web2
          git clone https://srytmj:${MY_TOKEN}@github.com/srytmj/ha-webserver-web2 temp-web2
          
          cd temp-web2
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +
          cd ..
          
          rsync -av --delete --exclude='.git/' web2/ temp-web2/
          
          cd temp-web2
          # ✅ PAKAI IDENTITAS YANG SAMA DENGAN PEMILIK TOKEN
          git config user.name "srytmj"
          git config user.email "srytmj@users.noreply.github.com"
          
          git add .
          git commit -m "sync from main repo - $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "no changes"
          
          # ✅ PAKAI USERNAME YANG SAMA DI URL
          git push https://srytmj:${MY_TOKEN}@github.com/srytmj/ha-webserver-web2 main
          
          cd ..
          rm -rf temp-web2

      # ---------- WEB1 (SAMA PERSIS) ----------
      - name: Sync to web1
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          rm -rf temp-web1
          git clone https://srytmj:${MY_TOKEN}@github.com/srytmj/ha-webserver-web1 temp-web1
          
          cd temp-web1
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +
          cd ..
          
          rsync -av --delete --exclude='.git/' web1/ temp-web1/
          
          cd temp-web1
          # ✅ PAKAI IDENTITAS YANG SAMA
          git config user.name "srytmj"
          git config user.email "srytmj@users.noreply.github.com"
          
          git add .
          git commit -m "sync from main repo - $(date -u '+%Y-%m-%d %H:%M:%S')" || echo "no changes"
          
          # ✅ PAKAI USERNAME YANG SAMA
          git push https://srytmj:${MY_TOKEN}@github.com/srytmj/ha-webserver-web1 main
          
          cd ..
          rm -rf temp-web1